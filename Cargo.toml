[workspace]
resolver = "3"
members = [
    "crates/castellan-core",
    "crates/castellan-winapi",
    "crates/castellan-guard",
    "crates/castellan-store",
    "crates/castellan-engine",
    "crates/castellan-sense",
    "crates/castellan-service",
    "crates/castellan-tui",
    "crates/castellan-cli",
    "apps/desktop/src-tauri",
    "xtask",
]
default-members = ["crates/castellan-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Denner Parreiras <dennerparreiras@gmail.com>"]
repository = "https://github.com/dennerparreiras/castellan"
rust-version = "1.100.0"
publish = false

[workspace.dependencies]
castellan-core = { path = "crates/castellan-core" }
castellan-winapi = { path = "crates/castellan-winapi" }
castellan-guard = { path = "crates/castellan-guard" }
castellan-engine = { path = "crates/castellan-engine" }
castellan-sense = { path = "crates/castellan-sense" }
castellan-service = { path = "crates/castellan-service" }
castellan-tui = { path = "crates/castellan-tui" }

thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
proptest = "1.12.0"
clap = { version = "4.6.8", features = ["derive"] }
ratatui = "0.30.2"
crossterm = "0.29.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
toml = "1.2.1"
blake3 = "1.8.7"
ts-rs = { version = "12.0.1", default-features = false, features = ["serde-compat"] }
assert_cmd = "2.2.2"
assert_fs = "1.1.4"

[workspace.lints.rust]
unsafe_code = { level = "forbid", priority = -1 }
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release-with-debug]
inherits = "release"
strip = "none"
debug = true
