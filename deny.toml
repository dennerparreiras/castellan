[advisories]
yanked = "deny"
unmaintained = "all"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    # Permissive licenses the master plan allows (section 5.2).
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
]
confidence-threshold = 0.8

# MPL-2.0 is file-level copyleft. These crates come in through Tauri's HTML and
# CSS handling, are used unmodified from crates.io, and do not change the MIT
# license of Castellan. Each one is listed by name; see docs/adr/0007-desktop-stack.md.
[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "cssparser"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "cssparser-macros"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "selectors"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "dtoa-short"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "option-ext"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path crates inside this workspace have no version. They are private (`publish = false`).
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
